name: Makerere Student Support CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install bandit pip-audit pytest-cov ruff

      - name: Validate Python syntax
        run: python -m compileall -q src tests

      - name: Lint with Ruff
        run: ruff check src tests

      - name: Run security checks
        run: |
          bandit -r src -ll
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815

      - name: Validate controlled knowledge register
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          register = json.loads(Path("knowledge/source_register.json").read_text())
          documents = register.get("documents")
          assert isinstance(documents, list) and documents, "No documents found in register"
          required = {"id", "title", "category", "authority"}
          for document in documents:
              missing = required - document.keys()
              assert not missing, f"Missing fields {missing}: {document}"
          print(f"Validated {len(documents)} registered documents")
          PY

      - name: Run tests with coverage
        run: python -m pytest -q --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
